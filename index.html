<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Operation Fankaa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }

  .stage { position: fixed; inset: 0; display: none; }
  .stage.active { display: block; }

  /* ---------- STAGE 1: VIDEO ---------- */
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }

  #bigPlayBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 110px; height: 110px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.92); box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s, opacity .3s; z-index: 5;
  }
  #bigPlayBtn:hover { transform: translate(-50%,-50%) scale(1.1); }
  #bigPlayBtn.hidden { opacity: 0; pointer-events: none; }
  #bigPlayBtn::after {
    content: ''; margin-left: 8px;
    border-left: 38px solid #111; border-top: 24px solid transparent; border-bottom: 24px solid transparent;
  }

  /* ---------- shared control bar (video + audio) ---------- */
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    opacity: 0; pointer-events: none; transition: opacity .35s;
  }
  .controls.visible { opacity: 1; pointer-events: auto; }
  .ctrlBtn {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.9); font-size: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .seek {
    -webkit-appearance: none; appearance: none; flex: 1; height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.25); cursor: pointer; outline: none;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffd9e8);
    border: 2px solid #f72585;
    box-shadow: 0 0 10px rgba(247,37,133,.8), 0 2px 6px rgba(0,0,0,.5);
    transition: transform .15s;
  }
  .seek::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .seek::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffd9e8);
    border: 2px solid #f72585; box-shadow: 0 0 10px rgba(247,37,133,.8);
  }
  .time { color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* ---------- STAGE 2: PICTURE ---------- */
  #picStage { background: #000; }
  #picStage.active { display: flex; flex-direction: column; align-items: center; }
  #bgImg {
    flex: 1 1 auto; min-height: 0; width: 100%;
    object-fit: contain; object-position: center; user-select: none; -webkit-user-drag: none;
  }
  .googly {
    position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 70%, #e8e8e8);
    border: 3px solid rgba(0,0,0,0.75); box-shadow: 0 4px 10px rgba(0,0,0,0.45), inset 0 -4px 8px rgba(0,0,0,0.12);
    z-index: 3;
  }
  .pupil {
    position: absolute; border-radius: 50%; background: #111;
    top: 50%; left: 50%;
  }
  .pupil::after {
    content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%;
    background: rgba(255,255,255,0.85); top: 15%; left: 15%;
  }

  /* draggable sticker (the eyes follow iba) */
  #sticker {
    position: absolute; z-index: 5; width: clamp(120px, 32vmin, 320px);
    transform: translate(-50%,-50%);
    cursor: grab; touch-action: none; user-select: none; -webkit-user-drag: none;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.6));
  }
  #sticker.dragging { cursor: grabbing; filter: drop-shadow(0 16px 30px rgba(0,0,0,0.7)); }

  #pwBox {
    flex: 0 0 auto; z-index: 4; display: flex; flex-direction: column; align-items: center;
    padding: 26px 16px calc(80px + env(safe-area-inset-bottom)); /* leaves room for audio bar */
  }
  .gift { position: relative; }
  .gift::before {
    content: '🎀'; position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    font-size: 34px; z-index: 2; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  #pwInput {
    padding: 16px 22px; font-size: 17px; font-weight: 600; color: #fff;
    border: 3px solid #8b0000; border-radius: 16px; text-align: center; outline: none; width: 280px;
    background:
      linear-gradient(to right, transparent calc(50% - 14px), rgba(255,255,255,.30) calc(50% - 14px), rgba(255,255,255,.30) calc(50% + 14px), transparent calc(50% + 14px)),
      linear-gradient(to bottom, transparent calc(50% - 12px), rgba(255,255,255,.18) calc(50% - 12px), rgba(255,255,255,.18) calc(50% + 12px), transparent calc(50% + 12px)),
      linear-gradient(135deg, #e63946, #c1121f);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55), inset 0 2px 6px rgba(255,255,255,0.25);
    caret-color: #ffd166; transition: transform .15s, box-shadow .15s;
  }
  #pwInput::placeholder { color: rgba(255,255,255,0.85); font-weight: 500; }
  #pwInput:focus { transform: scale(1.04); box-shadow: 0 12px 34px rgba(0,0,0,0.6), 0 0 0 4px rgba(255,209,102,0.45); }
  #pwHint { color: rgba(255,255,255,.75); font-size: 12.5px; margin-top: 10px; text-shadow: 0 2px 6px #000; }

  /* wrong password popup */
  #wrongPopup {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-2deg);
    z-index: 50; background: #ffdd57; border: 5px dashed #e0245e; border-radius: 22px;
    padding: 26px 34px; text-align: center; max-width: 85vw;
    box-shadow: 0 15px 60px rgba(0,0,0,0.6); display: none;
  }
  #wrongPopup.show { display: block; animation: shake .5s; }
  #wrongPopup .emoji { font-size: 52px; }
  #wrongPopup h2 { color: #e0245e; font-size: 24px; margin: 8px 0 4px; }
  #wrongPopup p { color: #333; font-size: 15px; }
  @keyframes shake {
    0%,100% { transform: translate(-50%,-50%) rotate(-2deg); }
    20% { transform: translate(-54%,-50%) rotate(-6deg); }
    40% { transform: translate(-46%,-50%) rotate(4deg); }
    60% { transform: translate(-53%,-50%) rotate(-4deg); }
    80% { transform: translate(-47%,-50%) rotate(3deg); }
  }

  /* ---------- STAGE 3: CONGRATS ---------- */
  #congratsStage {
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    background-size: 300% 300%; animation: bgShift 8s ease infinite;
    display: none; align-items: center; justify-content: center;
  }
  #congratsStage.active { display: flex; }
  @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  #congratsText {
    color: #fff; text-align: center; font-size: clamp(28px, 6vw, 64px); font-weight: 800;
    padding: 0 6vw; text-shadow: 0 6px 30px rgba(0,0,0,0.5); z-index: 2;
    animation: pop 0.8s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  #confettiCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
</style>
</head>
<body>

<!-- STAGE 1: VIDEO -->
<div class="stage active" id="videoStage">
  <video id="video" src="operation-fankaa.mp4" playsinline preload="auto"></video>
  <button id="bigPlayBtn" aria-label="Play"></button>
  <div class="controls" id="videoControls">
    <button class="ctrlBtn" id="vPlayPause">▶</button>
    <input type="range" class="seek" id="vSeek" min="0" max="100" step="0.1" value="0">
    <span class="time" id="vTime">0:00 / 0:00</span>
  </div>
</div>

<!-- STAGE 2: PICTURE + AUDIO + PASSWORD -->
<div class="stage" id="picStage">
  <img id="bgImg" src="imnotsingleanymore.png" alt="">
  <div class="googly" id="eyeL"><div class="pupil" id="pupilL"></div></div>
  <div class="googly" id="eyeR"><div class="pupil" id="pupilR"></div></div>
  <img id="sticker" src="ibaaaa.webp" alt="" draggable="false">

  <div id="pwBox">
    <div class="gift">
      <input type="password" id="pwInput" placeholder="Enter the secret password…" autocomplete="off">
    </div>
    <div id="pwHint">press Enter to unwrap your gift!</div>
  </div>

  <audio id="audio" src="hiy-roane-4-loabyge-docter.mp3" preload="auto"></audio>
  <div class="controls" id="audioControls">
    <button class="ctrlBtn" id="aPlayPause">⏸</button>
    <input type="range" class="seek" id="aSeek" min="0" max="100" step="0.1" value="0">
    <span class="time" id="aTime">0:00 / 0:00</span>
  </div>
</div>

<!-- Wrong password popup -->
<div id="wrongPopup">
  <div class="emoji">🔐</div>
  <h2 id="wrongTitle">Wrong password, try again!</h2>
  <p id="wrongSub"></p>
</div>

<!-- STAGE 3: CONGRATS -->
<div class="stage" id="congratsStage">
  <div id="congratsText">Congratulations Iba and Saalim!<br>We are so happy for you! 💕</div>
</div>
<canvas id="confettiCanvas"></canvas>

<script>
(function () {
  var PASSWORD = 'Ibaalim';

  /* Googly Eye positions */
  var EYES = {
    left:  { x: 0.452, y: 0.171 },
    right: { x: 0.532, y: 0.170 },
    size:  0.075   /* eye diameter as fraction of image width */
  };

  /* Where the eyes look on the sticker */
  var STICKER_FACE_Y = 0.28;   /* fraction of sticker height from its top */

  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), audio = $('audio');
  var videoStage = $('videoStage'), picStage = $('picStage'), congratsStage = $('congratsStage');

  /* ---------- helpers ---------- */
  function fmt(t) {
    if (!isFinite(t)) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* Auto-hiding control bar: shows on mousemove/touch, hides after idle */
  function autoHide(bar, stageEl) {
    var timer = null;
    function show() {
      bar.classList.add('visible');
      clearTimeout(timer);
      timer = setTimeout(function () { bar.classList.remove('visible'); }, 2800);
    }
    stageEl.addEventListener('mousemove', show);
    stageEl.addEventListener('touchstart', show, { passive: true });
    stageEl.addEventListener('click', show);
    bar.addEventListener('mousemove', show);
    return show;
  }

  /* Paint the filled portion of a seek bar */
  function paintSeek(seek) {
    var v = seek.value;
    seek.style.background = 'linear-gradient(90deg, #f72585 0%, #ffd166 ' + v + '%, rgba(255,255,255,0.25) ' + v + '%)';
  }

  /* Wire a media element to its bar */
  function wireMedia(media, btn, seek, timeEl) {
    var seeking = false;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (media.paused) media.play(); else media.pause();
    });
    media.addEventListener('play',  function () { btn.textContent = '⏸'; });
    media.addEventListener('pause', function () { btn.textContent = '▶'; });
    media.addEventListener('timeupdate', function () {
      if (!seeking && media.duration) seek.value = (media.currentTime / media.duration) * 100;
      timeEl.textContent = fmt(media.currentTime) + ' / ' + fmt(media.duration);
      paintSeek(seek);
    });
    media.addEventListener('loadedmetadata', function () {
      timeEl.textContent = fmt(0) + ' / ' + fmt(media.duration);
      paintSeek(seek);
    });
    function applySeek() { if (media.duration) media.currentTime = (seek.value / 100) * media.duration; }
    seek.addEventListener('input', function () { seeking = true; applySeek(); paintSeek(seek); });
    seek.addEventListener('change', function () { applySeek(); seeking = false; });
    paintSeek(seek);
  }

  /* ---------- STAGE 1 ---------- */
  video.addEventListener('error', function () {
    var err = video.error ? video.error.code : '?';
    var msg = document.createElement('div');
    msg.style.cssText = 'position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:9;background:#e0245e;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center';
    msg.textContent = 'Video failed to load (error ' + err + '). Make sure "operation-fankaa.mp4" is in the SAME folder as this HTML file.';
    videoStage.appendChild(msg);
  });
  var showVideoBar = autoHide($('videoControls'), videoStage);
  wireMedia(video, $('vPlayPause'), $('vSeek'), $('vTime'));

  $('bigPlayBtn').addEventListener('click', function () {
    var btn = this;
    video.play().then(function () {
      btn.classList.add('hidden');
      showVideoBar();
    }).catch(function (err) {
      alert('Could not play the video: ' + err.message + '\n\nMake sure "operation-fankaa.mp4" is in the same folder as this HTML file, and open the page in Chrome or Edge.');
    });
  });
  video.addEventListener('pause', function () {
    if (!video.ended) $('bigPlayBtn').classList.remove('hidden');
  });
  video.addEventListener('play', function () { $('bigPlayBtn').classList.add('hidden'); });

  video.addEventListener('ended', function () {
    videoStage.classList.remove('active');
    picStage.classList.add('active');
    layoutPicStage();
    placeStickerInitial();
    audio.play().catch(function () {});
    showAudioBar();
  });

  /* ---------- STAGE 2 ---------- */
  var showAudioBar = autoHide($('audioControls'), picStage);
  wireMedia(audio, $('aPlayPause'), $('aSeek'), $('aTime'));

  var bgImg = $('bgImg'), eyeL = $('eyeL'), eyeR = $('eyeR');
  var pupilL = $('pupilL'), pupilR = $('pupilR');
  var eyeCenters = { l: { x: 0, y: 0 }, r: { x: 0, y: 0 } }, eyeRadius = 30;

  /* googly eyes position over the face */
  function layoutPicStage() {
    if (!bgImg.naturalWidth || !picStage.classList.contains('active')) return;
    var rect = bgImg.getBoundingClientRect();
    var nw = bgImg.naturalWidth, nh = bgImg.naturalHeight;
    var scale = Math.min(rect.width / nw, rect.height / nh);
    var dw = nw * scale, dh = nh * scale;
    var ox = rect.left + (rect.width - dw) / 2;   /* displayed image origin */
    var oy = rect.top + (rect.height - dh) / 2;

    var d = EYES.size * dw;               /* eye diameter on screen */
    eyeRadius = d / 2;
    [['left', eyeL, 'l'], ['right', eyeR, 'r']].forEach(function (cfg) {
      var f = EYES[cfg[0]], el = cfg[1];
      var cx = ox + f.x * dw, cy = oy + f.y * dh;
      eyeCenters[cfg[2]].x = cx; eyeCenters[cfg[2]].y = cy;
      el.style.width = d + 'px'; el.style.height = d + 'px';
      el.style.left = (cx - d / 2) + 'px'; el.style.top = (cy - d / 2) + 'px';
    });
    var pd = d * 0.45;                    /* pupil diameter */
    [pupilL, pupilR].forEach(function (p) {
      p.style.width = pd + 'px'; p.style.height = pd + 'px';
      p.style.marginLeft = (-pd / 2) + 'px'; p.style.marginTop = (-pd / 2) + 'px';
    });
    lookAtSticker();                      /* keep eyes on her after re-layout */
  }
  bgImg.addEventListener('load', layoutPicStage);
  window.addEventListener('resize', layoutPicStage);

  /* Googly pupils look toward a point */
  function movePupils(px, py) {
    [['l', pupilL], ['r', pupilR]].forEach(function (cfg) {
      var c = eyeCenters[cfg[0]], p = cfg[1];
      var dx = px - c.x, dy = py - c.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var max = eyeRadius * 0.5;          /* how far the pupil may travel */
      var t = Math.min(max, dist);
      p.style.transform = 'translate(' + (dx / dist * t) + 'px,' + (dy / dist * t) + 'px)';
    });
  }

  /* ---------- DRAGGABLE STICKER (the eyes follow her) ---------- */
  var sticker = $('sticker');
  var stickerPos = { x: -1, y: -1 };      /* center of the sticker */

  function setSticker(x, y) {
    var r = sticker.getBoundingClientRect();
    var hw = (r.width || 100) / 2, hh = (r.height || 100) / 2;
    /* keep at least a third of the sticker on screen */
    x = Math.max(-hw / 3 + hw, Math.min(window.innerWidth  - hw + hw / 3, x));
    y = Math.max(hh * 0.5,     Math.min(window.innerHeight - hh * 0.5,  y));
    stickerPos.x = x; stickerPos.y = y;
    sticker.style.left = x + 'px';
    sticker.style.top  = y + 'px';
    lookAtSticker();
  }

  function lookAtSticker() {
    if (stickerPos.x < 0) return;
    var r = sticker.getBoundingClientRect();
    /* aim at her face (upper part of the sticker), not its center */
    movePupils(stickerPos.x, stickerPos.y - r.height * (0.5 - STICKER_FACE_Y));
  }

  function placeStickerInitial() {
    if (stickerPos.x >= 0) return;        /* only once */
    setSticker(window.innerWidth * 0.5, window.innerHeight * 0.5);
  }
  sticker.addEventListener('load', function () {
    if (picStage.classList.contains('active')) placeStickerInitial();
  });
  sticker.addEventListener('error', function () { sticker.style.display = 'none'; });

  /* drag with mouse or touch (pointer events cover both) */
  var dragging = false;
  sticker.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    dragging = true;
    sticker.classList.add('dragging');
    sticker.setPointerCapture(e.pointerId);
    setSticker(e.clientX, e.clientY);
  });
  sticker.addEventListener('pointermove', function (e) {
    if (dragging) setSticker(e.clientX, e.clientY);
  });
  function endDrag() { dragging = false; sticker.classList.remove('dragging'); }
  sticker.addEventListener('pointerup', endDrag);
  sticker.addEventListener('pointercancel', endDrag);

  /* ---------- PASSWORD ---------- */
  var wrongMsgs = [
    "That's not it, Sherlock!",
    "Nope! The eyes saw that coming.",
    "Access DENIED by the love police.",
    "So close… actually not close at all.",
    "Hint: it's not 'password123'."
  ];
  function checkPassword() {
    var val = $('pwInput').value.trim();
    if (val === PASSWORD) {
      audio.pause();
      picStage.classList.remove('active');
      congratsStage.classList.add('active');
      startConfetti();
    } else {
      var pop = $('wrongPopup');
      $('wrongSub').textContent = wrongMsgs[Math.floor(Math.random() * wrongMsgs.length)];
      pop.classList.remove('show');
      void pop.offsetWidth;               /* restart animation */
      pop.classList.add('show');
      setTimeout(function () { pop.classList.remove('show'); }, 2200);
      $('pwInput').value = '';
      $('pwInput').focus();
    }
  }
  $('pwInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPassword(); });

  /* ---------- CONFETTI ---------- */
  function startConfetti() {
    var canvas = $('confettiCanvas'), ctx = canvas.getContext('2d');
    var colors = ['#ff5e5e', '#ffd166', '#06d6a0', '#4cc9f0', '#f72585', '#ffffff', '#b5179e'];
    var parts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);

    function burst(x, y, n) {
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
        parts.push({
          x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
          w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
          c: colors[Math.floor(Math.random() * colors.length)],
          r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, life: 1
        });
      }
    }
    burst(canvas.width / 2, canvas.height / 2, 180);
    setInterval(function () {
      burst(Math.random() * canvas.width, Math.random() * canvas.height * 0.5, 60);
    }, 1200);

    (function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += 0.15; p.vx *= 0.99; p.x += p.vx; p.y += p.vy;
        p.r += p.vr; p.life -= 0.004;
        if (p.life <= 0 || p.y > canvas.height + 30) { parts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    })();
  }
})();
</script>
</body>
</html>
